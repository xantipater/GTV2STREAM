plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtv2stream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gtv2stream'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The helper test harness is dependency-free and can run offline on this host.
def helperTestClasses = layout.buildDirectory.dir('helper-test-classes')
tasks.register('compileHelperTests', JavaCompile) {
    dependsOn 'compileDebugJavaWithJavac'
    source = fileTree('src/test/java')
    classpath = files("${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    destinationDirectory = helperTestClasses
    options.release = 17
}
tasks.register('runHelperTests', JavaExec) {
    dependsOn 'compileHelperTests'
    classpath = files(helperTestClasses, "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    mainClass = 'com.gtv2stream.DeepLinkHelperTest'
}

// Test APK only: no AndroidX or other third-party library is shipped in the app.
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Exercise the actual R8/resource-shrunk APK, not a fabricated ZIP header.
tasks.register('verifyReleaseArchive', JavaExec) {
    dependsOn 'assembleRelease', 'compileHelperTests'
    classpath = files(helperTestClasses, "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    mainClass = 'com.gtv2stream.StabilisationTest'
    args layout.buildDirectory.file('outputs/apk/release/app-release-unsigned.apk').get().asFile.absolutePath
}
