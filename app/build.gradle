plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtv2stream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gtv2stream'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.1.0'
        testInstrumentationRunner 'android.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The helper test harness is dependency-free and can run offline on this host.
def helperTestClasses = layout.buildDirectory.dir('helper-test-classes')
tasks.register('compileHelperTests', JavaCompile) {
    dependsOn 'compileDebugJavaWithJavac'
    source = fileTree('src/test/java')
    classpath = files("${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    destinationDirectory = helperTestClasses
    options.release = 17
}
tasks.register('runHelperTests', JavaExec) {
    dependsOn 'compileHelperTests'
    classpath = files(helperTestClasses, "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    mainClass = 'com.gtv2stream.DeepLinkHelperTest'
}
